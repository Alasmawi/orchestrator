apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-app
  namespace: crud-master
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inventory-app
  template:
    metadata:
      labels:
        app: inventory-app
    spec:
      containers:
        - name: inventory-app
          image: __DOCKERHUB_USERNAME__/inventory-app:latest
          ports:
            - containerPort: 8080
          env:
            - name: INVENTORY_DB_HOST
              value: inventory-db
            - name: INVENTORY_DB_PORT
              value: "5432"
            - name: INVENTORY_APP_HOST
              value: "0.0.0.0"
            - name: INVENTORY_APP_PORT
              value: "8080"
            - name: INVENTORY_DB_NAME
              valueFrom: { secretKeyRef: { name: inventory-db-secret, key: POSTGRES_DB } }
            - name: INVENTORY_DB_USER
              valueFrom: { secretKeyRef: { name: inventory-db-secret, key: POSTGRES_USER } }
            - name: INVENTORY_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: inventory-db-secret, key: POSTGRES_PASSWORD } }
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "300m", memory: "256Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: inventory-app
  namespace: crud-master
spec:
  selector:
    app: inventory-app
  ports:
    - port: 8080
      targetPort: 8080
