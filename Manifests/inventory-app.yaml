# inventory-app: movies CRUD API backed by inventory-db. Stateless, so it
# runs as a Deployment scaled by inventory-app-hpa.yaml (1..3 pods, 60% CPU).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-app
  namespace: crud-master
  labels: { app: inventory-app }
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inventory-app
  template:
    metadata:
      labels:
        app: inventory-app
    spec:
      containers:
        - name: inventory-app
          image: __DOCKERHUB_USERNAME__/inventory-app:__IMAGE_TAG__
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: INVENTORY_DB_HOST
              value: inventory-db
            - name: INVENTORY_DB_PORT
              value: "5432"
            - name: INVENTORY_APP_HOST
              value: "0.0.0.0"
            - name: INVENTORY_APP_PORT
              value: "8080"
            - name: INVENTORY_DB_NAME
              valueFrom: { secretKeyRef: { name: inventory-db-secret, key: POSTGRES_DB } }
            - name: INVENTORY_DB_USER
              valueFrom: { secretKeyRef: { name: inventory-db-secret, key: POSTGRES_USER } }
            - name: INVENTORY_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: inventory-db-secret, key: POSTGRES_PASSWORD } }
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 15
            periodSeconds: 15
          # CPU requests are what the HPA's 60% target is measured against.
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "300m", memory: "256Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: inventory-app
  namespace: crud-master
  labels: { app: inventory-app }
spec:
  type: ClusterIP
  selector:
    app: inventory-app
  ports:
    - name: http
      port: 8080
      targetPort: http
