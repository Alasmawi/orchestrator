# rabbit-queue: RabbitMQ broker holding billing_queue. The spec only requires
# the databases and billing-app to be StatefulSets, so this is a Deployment.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbit-queue
  namespace: crud-master
  labels: { app: rabbit-queue }
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rabbit-queue
  template:
    metadata:
      labels:
        app: rabbit-queue
    spec:
      containers:
        - name: rabbit-queue
          image: __DOCKERHUB_USERNAME__/rabbit-queue:__IMAGE_TAG__
          ports:
            - name: amqp
              containerPort: 5672
            - name: management
              containerPort: 15672
          env:
            - name: RABBITMQ_USER
              valueFrom: { secretKeyRef: { name: rabbitmq-secret, key: RABBITMQ_USER } }
            - name: RABBITMQ_PASSWORD
              valueFrom: { secretKeyRef: { name: rabbitmq-secret, key: RABBITMQ_PASSWORD } }
          readinessProbe:
            exec: { command: ["rabbitmq-diagnostics", "-q", "check_port_connectivity"] }
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 10
          livenessProbe:
            exec: { command: ["rabbitmq-diagnostics", "-q", "ping"] }
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits: { cpu: "500m", memory: "512Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: rabbit-queue
  namespace: crud-master
  labels: { app: rabbit-queue }
spec:
  selector:
    app: rabbit-queue
  ports:
    - name: amqp
      port: 5672
      targetPort: amqp
    - name: management
      port: 15672
      targetPort: management
