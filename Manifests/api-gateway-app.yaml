# api-gateway-app: the only public entry point. Proxies /api/movies to
# inventory-app and publishes /api/billing bodies to RabbitMQ. Stateless
# Deployment scaled by api-gateway-app-hpa.yaml (1..3 pods, 60% CPU).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway-app
  namespace: crud-master
  labels: { app: api-gateway-app }
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway-app
  template:
    metadata:
      labels:
        app: api-gateway-app
    spec:
      containers:
        - name: api-gateway-app
          image: __DOCKERHUB_USERNAME__/api-gateway-app:__IMAGE_TAG__
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: GATEWAY_APP_HOST
              value: "0.0.0.0"
            - name: GATEWAY_APP_PORT
              value: "3000"
            - name: INVENTORY_API_URL
              value: "http://inventory-app:8080"
            - name: RABBITMQ_HOST
              value: rabbit-queue
            - name: RABBITMQ_PORT
              value: "5672"
            - name: BILLING_QUEUE
              value: billing_queue
            - name: RABBITMQ_USER
              valueFrom: { secretKeyRef: { name: rabbitmq-secret, key: RABBITMQ_USER } }
            - name: RABBITMQ_PASSWORD
              valueFrom: { secretKeyRef: { name: rabbitmq-secret, key: RABBITMQ_PASSWORD } }
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 15
            periodSeconds: 15
          # CPU requests are what the HPA's 60% target is measured against.
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "300m", memory: "256Mi" }
---
# LoadBalancer (K3s ServiceLB): reachable on <any-node-ip>:3000 from the host,
# plus the NodePort <any-node-ip>:30000 every LoadBalancer Service also gets.
apiVersion: v1
kind: Service
metadata:
  name: api-gateway-app
  namespace: crud-master
  labels: { app: api-gateway-app }
spec:
  type: LoadBalancer
  selector:
    app: api-gateway-app
  ports:
    - name: http
      port: 3000
      targetPort: http
      nodePort: 30000
---
# Ingress through K3s' bundled Traefik: reachable on http://<any-node-ip>/api/...
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api-gateway-app
  namespace: crud-master
  labels: { app: api-gateway-app }
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api-gateway-app
                port:
                  name: http
