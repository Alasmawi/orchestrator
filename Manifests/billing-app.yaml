apiVersion: v1
kind: Service
metadata:
  name: billing-app
  namespace: crud-master
spec:
  clusterIP: None
  selector:
    app: billing-app
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: billing-app
  namespace: crud-master
spec:
  serviceName: billing-app
  replicas: 1
  selector:
    matchLabels:
      app: billing-app
  template:
    metadata:
      labels:
        app: billing-app
    spec:
      containers:
        - name: billing-app
          image: __DOCKERHUB_USERNAME__/billing-app:latest
          ports:
            - containerPort: 8080
          env:
            - name: BILLING_DB_HOST
              value: billing-db
            - name: BILLING_DB_PORT
              value: "5432"
            - name: RABBITMQ_HOST
              value: rabbit-queue
            - name: RABBITMQ_PORT
              value: "5672"
            - name: BILLING_QUEUE
              value: billing_queue
            - name: BILLING_DB_NAME
              valueFrom: { secretKeyRef: { name: billing-db-secret, key: POSTGRES_DB } }
            - name: BILLING_DB_USER
              valueFrom: { secretKeyRef: { name: billing-db-secret, key: POSTGRES_USER } }
            - name: BILLING_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: billing-db-secret, key: POSTGRES_PASSWORD } }
            - name: RABBITMQ_USER
              valueFrom: { secretKeyRef: { name: rabbitmq-secret, key: RABBITMQ_USER } }
            - name: RABBITMQ_PASSWORD
              valueFrom: { secretKeyRef: { name: rabbitmq-secret, key: RABBITMQ_PASSWORD } }
          readinessProbe:
            httpGet: { path: /, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "300m", memory: "256Mi" }
