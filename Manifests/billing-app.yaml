# billing-app: consumes billing_queue and writes orders to billing-db.
# Deployed as a StatefulSet (per spec): the pod gets a stable identity
# (billing-app-0) and stable DNS through the headless Service.
apiVersion: v1
kind: Service
metadata:
  name: billing-app
  namespace: crud-master
  labels: { app: billing-app }
spec:
  clusterIP: None
  selector:
    app: billing-app
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: billing-app
  namespace: crud-master
  labels: { app: billing-app }
spec:
  serviceName: billing-app
  replicas: 1
  selector:
    matchLabels:
      app: billing-app
  template:
    metadata:
      labels:
        app: billing-app
    spec:
      initContainers:
        - name: wait-for-deps
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z -w 2 billing-db 5432; do echo waiting for billing-db; sleep 2; done
              until nc -z -w 2 rabbit-queue 5672; do echo waiting for rabbit-queue; sleep 2; done
      containers:
        - name: billing-app
          image: __DOCKERHUB_USERNAME__/billing-app:__IMAGE_TAG__
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: BILLING_DB_HOST
              value: billing-db
            - name: BILLING_DB_PORT
              value: "5432"
            - name: RABBITMQ_HOST
              value: rabbit-queue
            - name: RABBITMQ_PORT
              value: "5672"
            - name: BILLING_QUEUE
              value: billing_queue
            - name: BILLING_DB_NAME
              valueFrom: { secretKeyRef: { name: billing-db-secret, key: POSTGRES_DB } }
            - name: BILLING_DB_USER
              valueFrom: { secretKeyRef: { name: billing-db-secret, key: POSTGRES_USER } }
            - name: BILLING_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: billing-db-secret, key: POSTGRES_PASSWORD } }
            - name: RABBITMQ_USER
              valueFrom: { secretKeyRef: { name: rabbitmq-secret, key: RABBITMQ_USER } }
            - name: RABBITMQ_PASSWORD
              valueFrom: { secretKeyRef: { name: rabbitmq-secret, key: RABBITMQ_PASSWORD } }
          readinessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 15
            periodSeconds: 15
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "300m", memory: "256Mi" }
