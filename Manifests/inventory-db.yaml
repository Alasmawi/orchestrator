# inventory-db: PostgreSQL as a StatefulSet. The headless Service gives the pod a
# stable DNS name (inventory-db / inventory-db-0.inventory-db); the volumeClaimTemplate
# binds the NFS-backed PV from storage.yaml, so the data survives the pod
# being deleted, rescheduled, or moved to the other node.
apiVersion: v1
kind: Service
metadata:
  name: inventory-db
  namespace: crud-master
  labels: { app: inventory-db }
spec:
  clusterIP: None
  selector:
    app: inventory-db
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: inventory-db
  namespace: crud-master
  labels: { app: inventory-db }
spec:
  serviceName: inventory-db
  replicas: 1
  selector:
    matchLabels:
      app: inventory-db
  template:
    metadata:
      labels:
        app: inventory-db
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: inventory-db
          image: postgres:13-bullseye
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: inventory-db-secret, key: POSTGRES_USER } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: inventory-db-secret, key: POSTGRES_PASSWORD } }
            - name: POSTGRES_DB
              valueFrom: { secretKeyRef: { name: inventory-db-secret, key: POSTGRES_DB } }
          volumeMounts:
            - name: inventory-db-data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec: { command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""] }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec: { command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""] }
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "500m", memory: "512Mi" }
  volumeClaimTemplates:
    - metadata:
        name: inventory-db-data
      spec:
        storageClassName: nfs-static
        accessModes: ["ReadWriteOnce"]
        selector:
          matchLabels:
            volume-for: inventory-db
        resources:
          requests:
            storage: 1Gi
