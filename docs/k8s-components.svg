<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A3A4AB"/></marker></defs><rect width="1200" height="680" fill="#0E0F12"/><text x="30" y="34" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="11" fill="#EA5F70" letter-spacing="1.3" text-anchor="start">KUBERNETES COMPONENTS · AS THEY RUN IN THIS CLUSTER</text><text x="30" y="66" font-family="'Archivo Narrow','Arial Narrow','Roboto Condensed','Helvetica Neue',Arial,sans-serif" font-weight="800" font-size="30" fill="#EFE9DD" text-anchor="start">CONTROL PLANE, NODE AGENTS AND THE K3S ADD-ONS</text><line x1="30" y1="86" x2="1170" y2="86" stroke="rgba(239,233,221,.14)"/><rect x="30.5" y="104.5" width="560" height="368" fill="#15171C" stroke="rgba(239,233,221,.14)"/><rect x="30" y="104" width="4" height="369" fill="#B0122B"/><text x="48" y="128" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="11" fill="#EFE9DD" letter-spacing="1.3" text-anchor="start">CONTROL PLANE</text><text x="572" y="128" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="10" fill="#8D8F98" letter-spacing="1.3" text-anchor="end">master · k3s server</text><line x1="48" y1="146" x2="572" y2="146" stroke="rgba(239,233,221,.14)"/><text x="48" y="170" font-family="'Archivo Narrow','Arial Narrow','Roboto Condensed','Helvetica Neue',Arial,sans-serif" font-weight="800" font-size="18" fill="#EFE9DD" text-anchor="start">KUBE-APISERVER</text><text x="48" y="192" font-family="Archivo,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#A3A4AB">The front door. kubectl, kubelets and controllers all talk to it.</text><line x1="48" y1="208" x2="572" y2="208" stroke="rgba(239,233,221,.14)"/><text x="48" y="232" font-family="'Archivo Narrow','Arial Narrow','Roboto Condensed','Helvetica Neue',Arial,sans-serif" font-weight="800" font-size="18" fill="#EFE9DD" text-anchor="start">DATASTORE (ETCD · SQLITE IN K3S)</text><text x="48" y="254" font-family="Archivo,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#A3A4AB">Holds every object: the cluster&#x27;s desired and current state.</text><line x1="48" y1="270" x2="572" y2="270" stroke="rgba(239,233,221,.14)"/><text x="48" y="294" font-family="'Archivo Narrow','Arial Narrow','Roboto Condensed','Helvetica Neue',Arial,sans-serif" font-weight="800" font-size="18" fill="#EFE9DD" text-anchor="start">KUBE-SCHEDULER</text><text x="48" y="316" font-family="Archivo,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#A3A4AB">Chooses a node for each new pod from requests, affinity and taints.</text><line x1="48" y1="332" x2="572" y2="332" stroke="rgba(239,233,221,.14)"/><text x="48" y="356" font-family="'Archivo Narrow','Arial Narrow','Roboto Condensed','Helvetica Neue',Arial,sans-serif" font-weight="800" font-size="18" fill="#EFE9DD" text-anchor="start">KUBE-CONTROLLER-MANAGER</text><text x="48" y="378" font-family="Archivo,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#A3A4AB">Control loops: ReplicaSet, StatefulSet, HPA, node, endpoints.</text><line x1="48" y1="394" x2="572" y2="394" stroke="rgba(239,233,221,.14)"/><text x="48" y="418" font-family="'Archivo Narrow','Arial Narrow','Roboto Condensed','Helvetica Neue',Arial,sans-serif" font-weight="800" font-size="18" fill="#EFE9DD" text-anchor="start">CLOUD-CONTROLLER-MANAGER</text><text x="48" y="440" font-family="Archivo,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#A3A4AB">Cloud API glue. K3s ships its own; ServiceLB provides load balancers.</text><rect x="610.5" y="104.5" width="560" height="306" fill="#15171C" stroke="rgba(239,233,221,.14)"/><rect x="610" y="104" width="4" height="307" fill="#5C5E66"/><text x="628" y="128" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="11" fill="#EFE9DD" letter-spacing="1.3" text-anchor="start">NODE COMPONENTS</text><text x="1152" y="128" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="10" fill="#8D8F98" letter-spacing="1.3" text-anchor="end">master + agent</text><line x1="628" y1="146" x2="1152" y2="146" stroke="rgba(239,233,221,.14)"/><text x="628" y="170" font-family="'Archivo Narrow','Arial Narrow','Roboto Condensed','Helvetica Neue',Arial,sans-serif" font-weight="800" font-size="18" fill="#EFE9DD" text-anchor="start">KUBELET</text><text x="628" y="192" font-family="Archivo,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#A3A4AB">Starts the pods assigned to its node, runs probes, reports status.</text><line x1="628" y1="208" x2="1152" y2="208" stroke="rgba(239,233,221,.14)"/><text x="628" y="232" font-family="'Archivo Narrow','Arial Narrow','Roboto Condensed','Helvetica Neue',Arial,sans-serif" font-weight="800" font-size="18" fill="#EFE9DD" text-anchor="start">KUBE-PROXY</text><text x="628" y="254" font-family="Archivo,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#A3A4AB">Programs iptables so a Service IP reaches the pods behind it.</text><line x1="628" y1="270" x2="1152" y2="270" stroke="rgba(239,233,221,.14)"/><text x="628" y="294" font-family="'Archivo Narrow','Arial Narrow','Roboto Condensed','Helvetica Neue',Arial,sans-serif" font-weight="800" font-size="18" fill="#EFE9DD" text-anchor="start">CONTAINER RUNTIME · CONTAINERD</text><text x="628" y="316" font-family="Archivo,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#A3A4AB">Pulls images from Docker Hub and runs the containers.</text><line x1="628" y1="332" x2="1152" y2="332" stroke="rgba(239,233,221,.14)"/><text x="628" y="356" font-family="'Archivo Narrow','Arial Narrow','Roboto Condensed','Helvetica Neue',Arial,sans-serif" font-weight="800" font-size="18" fill="#EFE9DD" text-anchor="start">CNI · FLANNEL</text><text x="628" y="378" font-family="Archivo,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#A3A4AB">Pod network: every pod gets an IP reachable from both nodes.</text><text x="610" y="444" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="11" fill="#EFE9DD" letter-spacing="1.3" text-anchor="start">K3S ADD-ONS · KUBE-SYSTEM</text><rect x="610.5" y="454.5" width="276" height="74" fill="#15171C" stroke="rgba(239,233,221,.14)"/><rect x="610" y="454" width="4" height="75" fill="#5C5E66"/><text x="626" y="480" font-family="'Archivo Narrow','Arial Narrow','Roboto Condensed','Helvetica Neue',Arial,sans-serif" font-weight="800" font-size="17" fill="#EFE9DD" text-anchor="start">COREDNS</text><text x="626" y="500" font-family="Archivo,'Helvetica Neue',Arial,sans-serif" font-size="12" fill="#A3A4AB">Service names to IPs:</text><text x="626" y="517" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="10.5" fill="#EA5F70" letter-spacing="0.2" text-anchor="start">inventory-db.crud-master.svc</text><rect x="894.5" y="454.5" width="276" height="74" fill="#15171C" stroke="rgba(239,233,221,.14)"/><rect x="894" y="454" width="4" height="75" fill="#5C5E66"/><text x="910" y="480" font-family="'Archivo Narrow','Arial Narrow','Roboto Condensed','Helvetica Neue',Arial,sans-serif" font-weight="800" font-size="17" fill="#EFE9DD" text-anchor="start">TRAEFIK</text><text x="910" y="500" font-family="Archivo,'Helvetica Neue',Arial,sans-serif" font-size="12" fill="#A3A4AB">Ingress controller:</text><text x="910" y="517" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="10.5" fill="#EA5F70" letter-spacing="0.2" text-anchor="start">/api to api-gateway-app</text><rect x="610.5" y="538.5" width="276" height="74" fill="#15171C" stroke="rgba(239,233,221,.14)"/><rect x="610" y="538" width="4" height="75" fill="#5C5E66"/><text x="626" y="564" font-family="'Archivo Narrow','Arial Narrow','Roboto Condensed','Helvetica Neue',Arial,sans-serif" font-weight="800" font-size="17" fill="#EFE9DD" text-anchor="start">SERVICELB</text><text x="626" y="584" font-family="Archivo,'Helvetica Neue',Arial,sans-serif" font-size="12" fill="#A3A4AB">type: LoadBalancer:</text><text x="626" y="601" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="10.5" fill="#EA5F70" letter-spacing="0.2" text-anchor="start">gateway on node-ip:3000</text><rect x="894.5" y="538.5" width="276" height="74" fill="#15171C" stroke="rgba(239,233,221,.14)"/><rect x="894" y="538" width="4" height="75" fill="#5C5E66"/><text x="910" y="564" font-family="'Archivo Narrow','Arial Narrow','Roboto Condensed','Helvetica Neue',Arial,sans-serif" font-weight="800" font-size="17" fill="#EFE9DD" text-anchor="start">METRICS-SERVER</text><text x="910" y="584" font-family="Archivo,'Helvetica Neue',Arial,sans-serif" font-size="12" fill="#A3A4AB">Pod CPU and memory</text><text x="910" y="601" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="10.5" fill="#EA5F70" letter-spacing="0.2" text-anchor="start">that the HPAs read</text><text x="30" y="508" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="11" fill="#EFE9DD" letter-spacing="1.3" text-anchor="start">WHAT THEY DO FOR THIS PROJECT</text><text x="30" y="534" font-family="Archivo,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#A3A4AB">kubectl apply sends each manifest to the apiserver,</text><text x="30" y="554" font-family="Archivo,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#A3A4AB">which stores it in the datastore.</text><text x="30" y="574" font-family="Archivo,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#A3A4AB">Controllers create pods from Deployments and StatefulSets;</text><text x="30" y="594" font-family="Archivo,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#A3A4AB">the scheduler places them on master or agent.</text><text x="30" y="614" font-family="Archivo,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#A3A4AB">The kubelet starts them with containerd; flannel wires</text><text x="30" y="634" font-family="Archivo,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#A3A4AB">them together; kube-proxy and CoreDNS make Services work.</text><text x="30" y="654" font-family="Archivo,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#A3A4AB">metrics-server feeds the HPA, which resizes the Deployments.</text></svg>
