<text x="66" y="21.5" fill="#8D8F98" font-size="11" letter-spacing="1.4">BILLING QUEUE RESILIENCE</text>
<text x="1234" y="21.5" fill="#5C5E66" font-size="11" text-anchor="end">abdulla@alasmawi</text>
<text x="20" y="66.5"><tspan fill="#EA5F70" font-weight="700">❯</tspan><tspan fill="#EFE9DD" dx="7.55">kubectl scale statefulset billing-app --replicas=0 &amp;&amp; kubectl wait --for=delete pod/billing-app-0 --timeout=60s; kubectl get statefulset billing-app</tspan></text>
<text x="20" y="84.5" fill="#A3A4AB" xml:space="preserve">statefulset.apps/billing-app <tspan fill="#EFE9DD" font-weight="700">scaled</tspan></text>
<text x="20" y="102.5" fill="#A3A4AB" xml:space="preserve">pod/billing-app-0 <tspan fill="#EFE9DD" font-weight="700">condition met</tspan></text>
<text x="20" y="120.5" fill="#A3A4AB" xml:space="preserve">NAME          READY   AGE</text>
<text x="20" y="138.5" fill="#A3A4AB" xml:space="preserve">billing-app   0/0     3m3s</text>
<text x="20" y="156.5" fill="#A3A4AB" xml:space="preserve"></text>
<text x="20" y="174.5"><tspan fill="#EA5F70" font-weight="700">❯</tspan><tspan fill="#EFE9DD" dx="7.55">curl -X POST http://192.168.56.21:3000/api/billing/ -d &#x27;{&quot;user_id&quot;: &quot;22&quot;, &quot;number_of_items&quot;: &quot;10&quot;, &quot;total_amount&quot;: &quot;50&quot;}&#x27;</tspan></text>
<text x="20" y="192.5" fill="#A3A4AB" xml:space="preserve"><tspan fill="#EFE9DD" font-weight="700">HTTP 200</tspan></text>
<text x="20" y="210.5" fill="#A3A4AB" xml:space="preserve">{&quot;message&quot;:&quot;<tspan fill="#EFE9DD" font-weight="700">Message posted</tspan>&quot;}</text>
<text x="20" y="228.5" fill="#A3A4AB" xml:space="preserve"></text>
<text x="20" y="246.5"><tspan fill="#EA5F70" font-weight="700">❯</tspan><tspan fill="#EFE9DD" dx="7.55">kubectl exec pods/billing-db-0 -- sudo -i -u postgres psql -c &#x27;\l&#x27;</tspan></text>
<text x="20" y="264.5" fill="#A3A4AB" xml:space="preserve">                                               List of databases</text>
<text x="20" y="282.5" fill="#A3A4AB" xml:space="preserve">    Name    |    Owner     | Encoding  | Collate | Ctype | ICU Locale | Locale Provider |   Access privileges   </text>
<text x="20" y="300.5" fill="#A3A4AB" xml:space="preserve">------------+--------------+-----------+---------+-------+------------+-----------------+-----------------------</text>
<text x="20" y="318.5" fill="#A3A4AB" xml:space="preserve"> billing_db | billing_user | SQL_ASCII | C       | C     |            | libc            | </text>
<text x="20" y="336.5" fill="#A3A4AB" xml:space="preserve"> postgres   | postgres     | SQL_ASCII | C       | C     |            | libc            | </text>
<text x="20" y="354.5" fill="#A3A4AB" xml:space="preserve"> template0  | postgres     | SQL_ASCII | C       | C     |            | libc            | =c/postgres          +</text>
<text x="20" y="372.5" fill="#A3A4AB" xml:space="preserve">            |              |           |         |       |            |                 | postgres=CTc/postgres</text>
<text x="20" y="390.5" fill="#A3A4AB" xml:space="preserve"> template1  | postgres     | SQL_ASCII | C       | C     |            | libc            | =c/postgres          +</text>
<text x="20" y="408.5" fill="#A3A4AB" xml:space="preserve">            |              |           |         |       |            |                 | postgres=CTc/postgres</text>
<text x="20" y="426.5" fill="#A3A4AB" xml:space="preserve">(4 rows)</text>
