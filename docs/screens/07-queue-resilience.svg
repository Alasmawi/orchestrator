<text x="20" y="462.5"><tspan fill="#EA5F70" font-weight="700">❯</tspan><tspan fill="#EFE9DD" dx="7.55">kubectl exec pods/billing-db-0 -- sudo -i -u postgres psql -d billing_db -c &#x27;TABLE orders;&#x27;</tspan></text>
<text x="20" y="480.5" fill="#A3A4AB" xml:space="preserve"> id | user_id | number_of_items | total_amount </text>
<text x="20" y="498.5" fill="#A3A4AB" xml:space="preserve">----+---------+-----------------+--------------</text>
