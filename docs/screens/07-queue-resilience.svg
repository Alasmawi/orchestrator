<text x="20" y="570.5"><tspan fill="#EA5F70" font-weight="700">❯</tspan><tspan fill="#EFE9DD" dx="7.55">kubectl scale statefulset billing-app --replicas=1 &amp;&amp; kubectl wait --for=condition=Ready pod/billing-app-0 --timeout=120s; kubectl get statefulset billing-app</tspan></text>
